<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin | Wispy Letters</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 20px 80px;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .admin-header h1 {
            font-size: 3rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .tab-button {
            padding: 15px 30px;
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1rem;
            font-family: 'Cormorant Garamond', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .tab-button.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            color: var(--text-dark);
            font-size: 1rem;
            font-family: 'Cormorant Garamond', serif;
        }

        .form-group input[type="file"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            color: var(--text-dark);
            cursor: pointer;
        }

        .image-preview {
            margin-top: 10px;
            max-width: 300px;
            border-radius: 8px;
            display: none;
        }

        .image-preview img {
            width: 100%;
            border-radius: 8px;
        }

        .btn-primary {
            padding: 14px 40px;
            background: var(--primary-color);
            color: #f3f1ec;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-family: 'Cormorant Garamond', serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #c5a880;
            transform: translateY(-2px);
        }

        .posts-list {
            display: grid;
            gap: 20px;
        }

        .post-item {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-info h3 {
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .post-info p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .post-actions {
            display: flex;
            gap: 10px;
        }

        .btn-edit, .btn-delete {
            padding: 8px 20px;
            border: none;
            border-radius: 50px;
            font-family: 'Cormorant Garamond', serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: var(--primary-color);
            color: #f3f1ec;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-edit:hover, .btn-delete:hover {
            transform: translateY(-2px);
        }

        .connect-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .connect-bar p {
            color: var(--text-light);
            font-size: 0.9rem;
            margin: 0;
            flex: 1;
        }

        .btn-connect {
            padding: 10px 24px;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 50px;
            font-size: 0.95rem;
            font-family: 'Cormorant Garamond', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-connect:hover {
            background: var(--primary-color);
            color: #f3f1ec;
        }

        .btn-connect.connected {
            border-color: #28a745;
            color: #28a745;
            cursor: default;
        }

        .success-message {
            padding: 15px;
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            border-radius: 8px;
            color: #28a745;
            margin-bottom: 20px;
            display: none;
        }

        .error-message {
            padding: 15px;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            border-radius: 8px;
            color: #dc3545;
            margin-bottom: 20px;
            display: none;
        }

        #editor {
            min-height: 400px;
        }

        .ck-editor__editable {
            min-height: 400px;
        }

        .photo-grid-builder {
            border: 1px dashed rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.02);
        }

        .photo-grid-builder > label {
            display: block;
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .photo-grid-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-col {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 50px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.95rem;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-col.active,
        .btn-col:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #f3f1ec;
        }

        .photo-grid-inputs {
            display: grid;
            gap: 10px;
            margin-bottom: 16px;
        }

        .grid-photo-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            color: var(--text-dark);
            font-size: 1rem;
            font-family: 'Cormorant Garamond', serif;
            box-sizing: border-box;
        }

        .btn-insert-grid {
            padding: 10px 24px;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 50px;
            font-size: 0.95rem;
            font-family: 'Cormorant Garamond', serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-insert-grid:hover {
            background: var(--primary-color);
            color: #f3f1ec;
        }
    </style>
</head>
<body>
    <header></header>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Blog Admin</h1>
            <p style="color: var(--text-light);">Manage your blog posts</p>
        </div>

        <div class="connect-bar">
            <p>Connect your site folder so the admin can read and write files directly to disk.</p>
            <button class="btn-connect" id="connectBtn" onclick="connectSiteFolder()">Connect site folder</button>
        </div>

        <div class="success-message" id="successMessage"></div>
        <div class="error-message" id="errorMessage"></div>

        <div class="admin-tabs">
            <button class="tab-button active" data-tab="create">Create New Post</button>
            <button class="tab-button" data-tab="manage">Manage Posts</button>
        </div>

        <!-- Create Post Tab -->
        <div class="tab-content active" id="create-tab">
            <form id="postForm">
                <input type="hidden" id="postId" name="postId">

                <div class="form-group">
                    <label for="postTitle">Post Title *</label>
                    <input type="text" id="postTitle" name="postTitle" required>
                </div>

                <div class="form-group">
                    <label for="postDate">Publication Date *</label>
                    <input type="date" id="postDate" name="postDate" required>
                </div>

                <div class="form-group">
                    <label for="postCategory">Category *</label>
                    <select id="postCategory" name="postCategory" required>
                        <option value="">Select a category</option>
                        <option value="Events">Events</option>
                        <option value="Tutorials">Tutorials</option>
                        <option value="Wedding">Wedding</option>
                        <option value="Behind the Scenes">Behind the Scenes</option>
                        <option value="Tips & Advice">Tips & Advice</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="postExcerpt">Excerpt (Brief summary for blog listing) *</label>
                    <textarea id="postExcerpt" name="postExcerpt" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="postImage">Featured Image *</label>
                    <input type="file" id="postImage" name="postImage" accept="image/*">
                    <div class="image-preview" id="imagePreview">
                        <img id="previewImg" src="" alt="Preview">
                    </div>
                    <input type="hidden" id="currentImage" name="currentImage">
                </div>

                <div class="form-group">
                    <label for="editor">Post Content *</label>
                    <div id="editor"></div>
                </div>

                <!-- Photo Grid Builder -->
                <div class="photo-grid-builder">
                    <label>Insert Photo Grid</label>
                    <div class="photo-grid-controls">
                        <button type="button" class="btn-col" id="col1Btn" onclick="setGridColumns(1)">1 Column</button>
                        <button type="button" class="btn-col active" id="col2Btn" onclick="setGridColumns(2)">2 Columns</button>
                        <button type="button" class="btn-col" id="col3Btn" onclick="setGridColumns(3)">3 Columns</button>
                    </div>
                    <div class="photo-grid-inputs" id="photoGridInputs"></div>
                    <p style="font-size:0.85rem; color:var(--text-light); margin: 0 0 12px;">Select photos to upload. Connect your site folder first to auto-copy them.</p>
                    <button type="button" class="btn-insert-grid" onclick="insertPhotoGrid()">Insert into post ↑</button>
                </div>

                <button type="submit" class="btn-primary" id="submitButton">Publish Post</button>
                <button type="button" class="btn-primary" id="cancelEdit" style="display: none; background: #6c757d; margin-left: 10px;">Cancel</button>
            </form>
        </div>

        <!-- Manage Posts Tab -->
        <div class="tab-content" id="manage-tab">
            <div class="posts-list" id="postsList">
                <!-- Posts will be loaded here -->
            </div>
        </div>
    </div>

    <script src="nav.js"></script>
    <script src="https://cdn.ckeditor.com/ckeditor5/40.1.0/classic/ckeditor.js"></script>
    <script>
        let editor;
        let posts = [];
        let editingPostId = null;
        let siteRootHandle = null;

        // --- File System Access API ---
        async function connectSiteFolder() {
            try {
                siteRootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                const btn = document.getElementById('connectBtn');
                btn.textContent = 'Site folder connected ✓';
                btn.classList.add('connected');
                btn.onclick = null;
                showSuccess('Site folder connected. Changes will save directly to files.');
                await loadPosts();
            } catch (e) {
                if (e.name !== 'AbortError') showError('Could not connect to site folder.');
            }
        }

        async function writeSiteFile(relativePath, content) {
            if (!siteRootHandle) throw new Error('no-handle');
            const parts = relativePath.split('/');
            let dir = siteRootHandle;
            for (let i = 0; i < parts.length - 1; i++) {
                dir = await dir.getDirectoryHandle(parts[i]);
            }
            const fh = await dir.getFileHandle(parts[parts.length - 1], { create: true });
            const writable = await fh.createWritable();
            await writable.write(content);
            await writable.close();
        }

        function downloadFile(filename, content, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- CKEditor ---
        ClassicEditor
            .create(document.querySelector('#editor'), {
                toolbar: ['heading', '|', 'bold', 'italic', 'link', 'bulletedList', 'numberedList', '|', 'blockQuote', 'insertImage', '|', 'undo', 'redo'],
                heading: {
                    options: [
                        { model: 'paragraph', title: 'Paragraph', class: 'ck-heading_paragraph' },
                        { model: 'heading2', view: 'h2', title: 'Heading 2', class: 'ck-heading_heading2' },
                        { model: 'heading3', view: 'h3', title: 'Heading 3', class: 'ck-heading_heading3' }
                    ]
                },
                image: {
                    toolbar: ['imageStyle:block', 'imageStyle:side', '|', 'imageTextAlternative']
                },
                generalHtmlSupport: {
                    allow: [
                        { name: 'div', attributes: true, classes: true, styles: true }
                    ]
                }
            })
            .then(newEditor => { editor = newEditor; })
            .catch(console.error);

        // --- Tabs ---
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                button.classList.add('active');
                document.getElementById(`${button.dataset.tab}-tab`).classList.add('active');
                if (button.dataset.tab === 'manage') loadPosts();
            });
        });

        // --- Copy a file to Photos/blog/ via File System Access API ---
        async function copyPhotoToBlog(file) {
            if (!siteRootHandle) return false;
            try {
                const photosDir = await siteRootHandle.getDirectoryHandle('Photos', { create: false });
                const blogDir = await photosDir.getDirectoryHandle('blog', { create: true });
                const fh = await blogDir.getFileHandle(file.name, { create: true });
                const writable = await fh.createWritable();
                await writable.write(await file.arrayBuffer());
                await writable.close();
                return true;
            } catch (e) {
                console.error('Could not copy photo:', e);
                return false;
            }
        }

        // --- Featured image upload ---
        document.getElementById('postImage').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                document.getElementById('previewImg').src = ev.target.result;
                document.getElementById('imagePreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
            document.getElementById('currentImage').value = `Photos/blog/${file.name}`;
            if (siteRootHandle) {
                const copied = await copyPhotoToBlog(file);
                showSuccess(copied
                    ? `"${file.name}" copied to Photos/blog/ ✓`
                    : `Could not auto-copy. Manually place "${file.name}" in Photos/blog/.`);
            } else {
                showError(`Site folder not connected — manually copy "${file.name}" to Photos/blog/ before saving.`);
            }
        });

        // --- Load posts from posts.json ---
        async function loadPosts() {
            // 1. Try File System Access handle (works with file:// URLs too)
            if (siteRootHandle) {
                try {
                    const postsDir = await siteRootHandle.getDirectoryHandle('blog-posts');
                    const fh = await postsDir.getFileHandle('posts.json');
                    const file = await fh.getFile();
                    posts = JSON.parse(await file.text());
                    displayPosts();
                    return;
                } catch (e) {
                    console.error('File handle read failed:', e);
                }
            }

            // 2. Try fetch (works when served via Live Server or similar)
            try {
                const response = await fetch('blog-posts/posts.json?nocache=' + Date.now());
                if (response.ok) {
                    posts = await response.json();
                    displayPosts();
                    return;
                }
            } catch (e) {
                console.error('Fetch failed:', e);
            }

            // 3. Fallback to localStorage
            const saved = localStorage.getItem('blogPosts');
            posts = saved ? JSON.parse(saved) : [];
            if (posts.length === 0) {
                document.getElementById('postsList').innerHTML =
                    '<p style="color: rgba(255,255,255,0.6); text-align: center;">Could not load posts. Open via Live Server, or click "Connect site folder" first.</p>';
                return;
            }
            displayPosts();
        }

        // --- Display posts ---
        function displayPosts() {
            const postsList = document.getElementById('postsList');
            if (posts.length === 0) {
                postsList.innerHTML = '<p style="color: rgba(255,255,255,0.6); text-align: center;">No posts yet. Create your first post!</p>';
                return;
            }
            posts.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            postsList.innerHTML = posts.map(post => `
                <div class="post-item">
                    <div class="post-info">
                        <h3>${post.title}</h3>
                        <p>${post.date} • ${post.category}</p>
                    </div>
                    <div class="post-actions">
                        <button class="btn-edit" onclick="editPost('${post.id}')">Edit</button>
                        <button class="btn-delete" onclick="deletePost('${post.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // --- Edit post: fetch actual HTML file for content ---
        async function editPost(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;

            editingPostId = postId;
            document.getElementById('postTitle').value = post.title;
            document.getElementById('postDate').value = post.timestamp;
            document.getElementById('postCategory').value = post.category;
            document.getElementById('postExcerpt').value = post.excerpt || '';
            document.getElementById('currentImage').value = post.image;
            document.getElementById('previewImg').src = post.image;
            document.getElementById('imagePreview').style.display = 'block';

            // Extract content from HTML string
            function extractContent(html) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const contentDiv = doc.querySelector('.blog-post-content');
                return contentDiv ? contentDiv.innerHTML.trim() : '';
            }

            let content = '';

            // 1. Try File System Access handle (works with file:// URLs too)
            if (siteRootHandle && !content) {
                try {
                    const blogPostsDir = await siteRootHandle.getDirectoryHandle('blog-posts');
                    const fh = await blogPostsDir.getFileHandle(`${postId}.html`);
                    const file = await fh.getFile();
                    content = extractContent(await file.text());
                } catch (e) {
                    console.error('File handle read failed:', e);
                }
            }

            // 2. Try fetch (works when served via Live Server)
            if (!content) {
                try {
                    const res = await fetch(`blog-posts/${postId}.html?nocache=${Date.now()}`);
                    if (res.ok) content = extractContent(await res.text());
                } catch (e) {
                    console.error('Could not fetch post HTML:', e);
                }
            }

            // 3. Fallback to localStorage
            if (!content) {
                const saved = localStorage.getItem(`blogPost_${postId}`);
                if (saved) content = extractContent(saved);
            }

            // Convert saved grid HTML back to shortcodes so CKEditor can display them
            content = content.replace(
                /<div class="photo-grid-(\d+)col">([\s\S]*?)<\/div>/g,
                (match, cols, inner) => {
                    const paths = [];
                    const re = /<img[^>]+src="([^"]+)"/g;
                    let m;
                    while ((m = re.exec(inner)) !== null) {
                        paths.push(m[1].replace(/^\.\.\//, ''));
                    }
                    return paths.length ? `[photo-grid-${cols}: ${paths.join(' | ')}]` : '';
                }
            );

            editor.setData(content);
            document.getElementById('submitButton').textContent = 'Update Post';
            document.getElementById('cancelEdit').style.display = 'inline-block';
            document.querySelector('[data-tab="create"]').click();
            document.querySelector('[data-tab="create"]').textContent = 'Edit Post';
            showSuccess('Editing: ' + post.title);
        }

        // --- Slug helper ---
        function createSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        }

        // --- Form submission ---
        document.getElementById('postForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('postTitle').value;
            const date = document.getElementById('postDate').value;
            const category = document.getElementById('postCategory').value;
            const excerpt = document.getElementById('postExcerpt').value;
            const content = editor.getData();
            const currentImage = document.getElementById('currentImage').value;

            if (!title || !date || !category || !excerpt || !content) {
                showError('Please fill in all required fields');
                return;
            }
            if (!currentImage) {
                showError('Please select a featured image');
                return;
            }

            const postId = editingPostId || createSlug(title);
            const dateObj = new Date(date + 'T12:00:00');
            const formattedDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

            const post = {
                id: postId,
                title,
                date: formattedDate,
                timestamp: date,
                category,
                excerpt,
                image: currentImage,
                url: `blog-posts/${postId}.html`
            };

            if (editingPostId) {
                const index = posts.findIndex(p => p.id === editingPostId);
                posts[index] = post;
            } else {
                posts.push(post);
            }

            await savePosts();
            await createPostHTML(post, content);

            resetForm();
            showSuccess(editingPostId ? 'Post updated successfully!' : 'Post published successfully!');
            setTimeout(() => document.querySelector('[data-tab="manage"]').click(), 1500);
        });

        // --- Save posts.json ---
        async function savePosts() {
            const json = JSON.stringify(posts, null, 2);
            localStorage.setItem('blogPosts', json);
            try {
                await writeSiteFile('blog-posts/posts.json', json);
                await updateBlogHTML();
                await updateOnsiteHTML();
            } catch (e) {
                if (e.message === 'no-handle') {
                    downloadFile('posts.json', json, 'application/json');
                    downloadFile('blog.html', buildBlogHTML(), 'text/html');
                    showError('Site folder not connected — posts.json and blog.html downloaded. Move them to the site root / blog-posts/.');
                } else {
                    throw e;
                }
            }
        }

        // Rebuild the blog.html grid by reading the file, replacing the grid contents
        async function updateBlogHTML() {
            if (!siteRootHandle) return;
            try {
                const fh = await siteRootHandle.getFileHandle('blog.html');
                const file = await fh.getFile();
                const original = await file.text();

                const sorted = [...posts].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                const cards = sorted.map(post => `                <div class="blog-card">
                    <div class="blog-thumbnail">
                        <a href="${post.url}"><img src="${post.image}" alt="${post.title}"></a>
                    </div>
                    <div class="blog-card-content">
                        <h3><a href="${post.url}">${post.title}</a></h3>
                        <p class="blog-date">${post.date}</p>
                        <p class="blog-excerpt">${post.excerpt}</p>
                    </div>
                </div>`).join('\n');

                const updated = original.replace(
                    /(<div class="blog-grid">)[\s\S]*?(<\/div>\s*<\/div>\s*<\/section>)/,
                    `$1\n${cards}\n            $2`
                );

                const writable = await (await siteRootHandle.getFileHandle('blog.html', { create: false })).createWritable();
                await writable.write(updated);
                await writable.close();
            } catch (e) {
                console.error('Could not update blog.html:', e);
            }
        }

        // Rebuild the event-recaps-grid in onsite.html with the latest 4 posts
        async function updateOnsiteHTML() {
            if (!siteRootHandle) return;
            try {
                const fh = await siteRootHandle.getFileHandle('onsite.html');
                const file = await fh.getFile();
                const original = await file.text();

                const sorted = [...posts].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                const latest4 = sorted.slice(0, 4);

                const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

                const cards = latest4.map(post => `                <a href="${post.url}" class="event-recap-card">
                    <div class="event-recap-thumbnail">
                        <img src="${post.image}" alt="${esc(post.title)}">
                    </div>
                    <div class="event-recap-overlay">
                        <h4>${esc(post.title)}</h4>
                        <p class="blog-date">${post.date}</p>
                        <p>${esc(post.excerpt)}</p>
                        <span class="service-learn-more">
                            <span>Read more</span>
                            <svg class="arrow-icon" width="32" height="16" viewBox="0 0 32 16">
                                <path class="arrow" d="M1 8 L28 8 M28 8 L24 4 M28 8 L24 12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </div>
                </a>`).join('\n');

                const updated = original.replace(
                    /(<div class="event-recaps-grid">)[\s\S]*?(<\/div>\s*<\/div>\s*<\/section>)/,
                    `$1\n${cards}\n            $2`
                );

                const writable = await (await siteRootHandle.getFileHandle('onsite.html', { create: false })).createWritable();
                await writable.write(updated);
                await writable.close();
            } catch (e) {
                console.error('Could not update onsite.html:', e);
            }
        }

        function buildBlogHTML() {
            // Returns just the cards HTML for manual placement
            const sorted = [...posts].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            return sorted.map(post => `<div class="blog-card">
    <div class="blog-thumbnail">
        <a href="${post.url}"><img src="${post.image}" alt="${post.title}"></a>
    </div>
    <div class="blog-card-content">
        <h3><a href="${post.url}">${post.title}</a></h3>
        <p class="blog-date">${post.date}</p>
        <p class="blog-excerpt">${post.excerpt}</p>
    </div>
</div>`).join('\n');
        }

        // --- Build and save post HTML ---
        async function createPostHTML(post, content) {
            // Expand photo grid shortcodes → real HTML grids
            // Match both bare shortcodes and <p>-wrapped ones (CKEditor wraps text in <p>)
            content = content.replace(
                /(?:<p>\s*)?\[photo-grid-(\d+):\s*([^\]]+)\](?:\s*<\/p>)?/g,
                (match, cols, pathsStr) => {
                    const imgs = pathsStr.split('|').map(p => {
                        const src = p.trim().replace(/^Photos\//, '../Photos/');
                        return `<img src="${src}" alt="">`;
                    }).join('');
                    return `<div class="photo-grid-${cols}col">${imgs}</div>`;
                }
            );
            // Rewrite any remaining root-relative Photos/ paths (from insertImage toolbar)
            content = content.replace(/src="Photos\//g, 'src="../Photos/');
            const html = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${post.title} | Wispy Letters</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header></header>

    <article class="blog-post">
        <div class="container">
            <div class="blog-post-header">
                <h2>${post.title}</h2>
                <div class="blog-post-meta">
                    <span class="blog-post-date">${post.date}</span>
                    <span class="blog-post-category">${post.category}</span>
                </div>
            </div>

            <div class="blog-post-featured-image">
                <img src="../${post.image}" alt="${post.title}">
            </div>

            <div class="blog-post-content">
                ${content}
            </div>

            <div class="blog-post-footer">
                <a href="../blog.html" class="back-to-blog">\u2190 Back to Blog</a>
            </div>
        </div>
    </article>
    <div id="contact-footer"></div>

    <script src="../banner.js"><\/script>
    <script src="../nav.js"><\/script>
    <script src="../script.js"><\/script>
    <script src="../contact.js"><\/script>
</body>
</html>`;

            localStorage.setItem(`blogPost_${post.id}`, html);
            try {
                await writeSiteFile(`blog-posts/${post.id}.html`, html);
            } catch (e) {
                if (e.message === 'no-handle') {
                    downloadFile(`${post.id}.html`, html, 'text/html');
                    showError('Site folder not connected — HTML file downloaded. Move it to blog-posts/.');
                } else {
                    throw e;
                }
            }
        }

        // --- Delete post ---
        async function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            posts = posts.filter(p => p.id !== postId);
            localStorage.removeItem(`blogPost_${postId}`);
            await savePosts();
            displayPosts();
            showSuccess('Post deleted.');
        }

        // --- Reset form ---
        function resetForm() {
            document.getElementById('postForm').reset();
            editor.setData('');
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('postId').value = '';
            document.getElementById('currentImage').value = '';
            document.getElementById('submitButton').textContent = 'Publish Post';
            document.getElementById('cancelEdit').style.display = 'none';
            document.querySelector('[data-tab="create"]').textContent = 'Create New Post';
            editingPostId = null;
        }

        document.getElementById('cancelEdit').addEventListener('click', resetForm);

        // --- Photo Grid Builder ---
        let gridColumns = 2;
        const gridPhotoPaths = {}; // col index → path

        function setGridColumns(n) {
            gridColumns = n;
            document.getElementById('col1Btn').classList.toggle('active', n === 1);
            document.getElementById('col2Btn').classList.toggle('active', n === 2);
            document.getElementById('col3Btn').classList.toggle('active', n === 3);
            renderGridInputs();
        }

        function renderGridInputs() {
            for (let key in gridPhotoPaths) delete gridPhotoPaths[key];
            const container = document.getElementById('photoGridInputs');
            let html = '';
            for (let i = 0; i < gridColumns; i++) {
                html += `
                <div style="display:flex; flex-direction:column; gap:6px;">
                    <label style="font-size:0.8rem; color:var(--text-light);">Column ${i + 1}</label>
                    <input type="file" class="grid-photo-file" accept="image/*" data-col="${i}"
                        style="padding:8px; background:rgba(0,0,0,0.03); border:1px solid rgba(0,0,0,0.15); border-radius:8px; cursor:pointer;">
                    <div class="grid-photo-preview" data-col="${i}" style="display:none;"></div>
                </div>`;
            }
            container.innerHTML = html;
            container.querySelectorAll('.grid-photo-file').forEach(input => {
                input.addEventListener('change', () => handleGridPhoto(input));
            });
        }

        async function handleGridPhoto(input) {
            const col = parseInt(input.dataset.col);
            const file = input.files[0];
            if (!file) return;

            const path = `Photos/blog/${file.name}`;
            gridPhotoPaths[col] = path;

            // Show preview
            const preview = document.querySelector(`.grid-photo-preview[data-col="${col}"]`);
            const reader = new FileReader();
            reader.onload = ev => {
                preview.innerHTML = `<img src="${ev.target.result}" style="width:100%; height:100px; object-fit:cover; border-radius:6px;">`;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);

            // Auto-copy to Photos/blog/ if folder connected
            if (siteRootHandle) {
                await copyPhotoToBlog(file);
            }
        }

        function insertPhotoGrid() {
            const paths = [];
            for (let i = 0; i < gridColumns; i++) {
                if (gridPhotoPaths[i]) paths.push(gridPhotoPaths[i]);
            }
            if (!paths.length) {
                showError('Please select at least one photo.');
                return;
            }
            if (!siteRootHandle) {
                showError('Connect your site folder first so photos are auto-copied to Photos/blog/.');
            }

            // Insert a shortcode placeholder that createPostHTML() will expand
            // (bypasses CKEditor schema — 100% reliable)
            const shortcode = `[photo-grid-${gridColumns}: ${paths.join(' | ')}]`;
            editor.model.change(writer => {
                const insertPosition = editor.model.document.selection.getFirstPosition();
                writer.insertText(shortcode, insertPosition);
            });

            renderGridInputs();
            showSuccess(`${gridColumns}-column photo grid added. It will render in the published post.`);
        }

        renderGridInputs();

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 8000);
        }

        loadPosts();
    </script>
    <script src="contact.js"></script>
</body>
</html>
